# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    post_checkout:
      # hatch-vcs derives the version from git tags; RTD's default clone is
      # shallow and tagless.
      - git fetch --unshallow || true
      - git fetch --tags || true
    post_create_environment:
      - pip install uv
    post_install:
      # Install into RTD's own virtualenv rather than uv's default `.venv`.
      - VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH uv sync --group docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
