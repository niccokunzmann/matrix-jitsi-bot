#
# We use the pyproject.toml package specification.
# See https://packaging.python.org/en/latest/guides/section-build-and-publish/
# See https://github.com/collective/icalendar/issues/686
# See https://packaging.python.org/en/latest/specifications/pyproject-toml/
#

[build-system]
requires = ["hatchling>=1.27.0", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "matrix-jitsi-bot"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = [
    "matrix",
    "jitsi",
    "bot",
]
# If an email address for the authors ever arises, then add it here.
# See https://github.com/collective/icalendar/pull/707#discussion_r1775275335
authors = [
  { name="Nicco Kunzmann", email="niccokunzmann@rambler.ru" },
]
maintainers = [
  { name="Nicco Kunzmann", email="niccokunzmann@rambler.ru" },
]
# These attributes are dynamically generated by hatch-vcs
dynamic = [
    "version"
]
description = "Watch Jitsi conferences and report to matrix chat rooms"
readme = { file = "README.md", content-type = "text/markdown"}

##
## When adjusting the Python Version, adjust also:
## - .github/workflows/tests.yml
## - tool.ruff.target-version
## - Makefile
##
requires-python = ">=3.12"

# see https://pypi.python.org/pypi?%3Aaction=list_classifiers
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

dependencies = [
    "inspect-jitsi",
    "nio-bot",
    "matrix-nio[e2e]",
    "aiohttp",
    "typer",
    "django",
]

# Static URLs for GitHub dependency graph compatibility
# See https://github.com/collective/icalendar/issues/1035
[project.urls]
Repository = "https://github.com/niccokunzmann/matrix-jitsi-bot"
Issues = "https://github.com/niccokunzmann/matrix-jitsi-bot/issues"
Documentation = "https://matrix-jitsi-bot.readthedocs.io"

# Local development dependencies
[dependency-groups]
dev = [
  {include-group = "test"},
  {include-group = "docs"},
  {include-group = "formatting"},
  "tox",
  "tox-uv",
]

test = [
    "coverage",
    "hypothesis",
    "mypy>=1.0",
    "pytest",
]

formatting = [
    "ruff==0.15.2", # also update .pre-commit-config.yaml
    "pre-commit",
]

docs = [
    "myst-parser>=5.1.0",
    "pydata-sphinx-theme>=0.14.4",
    "sphinx>=7",
    "sphinx-autobuild>=2021.3.14",
    "sphinx-autodoc-typehints",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.5.0",
    "sphinx-notfound-page>=1.1.0",
    "sphinx-reredirects>=0.1.6",
]

[project.scripts]
matrix-jitsi-bot = "matrix_jitsi_bot.cli:app"

[tool.hatch.build]
exclude = [
  "/.*",
  "/*.*",
  "/dist",
  "/build",
  "/htmlcov",
]

[tool.hatch.build.targets.sdist.force-include]

[tool.hatch.build.targets.wheel]
packages = ["matrix_jitsi_bot"]

[tool.hatch.metadata.hooks.vcs.urls]
# Dynamic URLs for built packages (hatch-vcs replaces static [project.urls])
source_archive = "https://github.com/niccokunzmann/matrix-jitsi-bot/archive/{commit_hash}.zip"
Issues = "https://github.com/niccokunzmann/matrix-jitsi-bot/issues"

[tool.hatch.version]
# This configuration allows us to use the version from the tags and dynamically generate
# version files. This speeds up the release process.
source = "vcs"

[tool.hatch.version.raw-options]
# see https://github.com/ofek/hatch-vcs/issues/43#issuecomment-1553065222
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "matrix_jitsi_bot/_version.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py312"
unsafe-fixes = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN",     # flake8-annotations
    "B020",    # Loop control variable {name} overrides iterable it iterates
    "C401",    # Unnecessary generator (rewrite as a set comprehension)
    "C901",    # {name} is too complex ({complexity} > {max_complexity})
    "COM812",  # Trailing comma missing
    "D1",      # Missing docstring
    "D2",      # docstrings stuffs
    "D4",      # docstrings stuffs
    "EM10",    # Exception string usage
    "ERA001",  # Found commented-out code
    "FBT002",  # Boolean default positional argument in function definition
    "FIX",     # TODO comments
    "ISC001",  # Implicitly concatenated string literals on one line (to avoid with formatter)
    "N818",    # Exception name {name} should be named with an Error suffix
    "PLR091",  # Too many things (complexity, arguments, branches, etc...)
    "PLR2004", # Magic value used in comparison, consider replacing {value} with a constant variable
    "RUF012",  # Mutable class attributes should be annotated with typing.ClassVar
    "RUF015",  # Prefer next({iterable}) over single element slice
    "S101",    # Use of assert detected
    "TD",      # TODO comments
    "TRY003",  # Avoid specifying long messages outside the exception class
    "S104",    # Possible binding to all interfaces
    "E722",    # Do not use bare `except`
    "RUF005",  # Consider iterable unpacking instead of concatenation
    "DTZ005",  # `datetime.datetime.now()` called without a `tz` argument
    "PERF401", # Use a list comprehension to create a transformed list
    "ARG002",  # Unused method argument: ...
    "ARG001",  # Unused function argument: ...
    "PLC0415", # import outside top-level - django/niobot must be imported after setup_django()
]
extend-safe-fixes = [
    "PT006", # Wrong type passed to first argument of @pytest.mark.parametrize; expected {expected_string}
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
"matrix_jitsi_bot/tests/**" = [
    "B011",   # Do not assert False (python -O removes these calls), raise AssertionError()
    "B018",   # useless expression, used to test property access errors
    "DTZ001", # datetime.datetime() called without a tzinfo argument
    "E501",   # line too long
    "E721",   # comparing types with ==
    "E741",   # ambiguous variable name
    "FBT001", # Boolean positional argument in function definition
    "FBT003", # Boolean positional value in function call
    "INP001", # implicit namespace package
    "N802",   # Function name {name} should be lowercase
    "N803",   # Argument name {name} for {param_type} should be lowercase
    "N806",   # Variable should be lowercase
    "N999",   # module name
    "PLC0415", # import outside top-level - common in tests for isolation
    "PT011",  # pytest.raises({exception}) is too broad
    "PT012",  # pytest.raises() block should contain a single simple statement
    "PT015",  # Assertion always fails, replace with pytest.fail()
    "PT027",  # assertRaises
    "RUF001", # String contains ambiguous character
    "S105",   # Possible hardcoded password (assignment) - test fixtures use dummy credentials
    "S106",   # Possible hardcoded password (argument) - test fixtures use dummy credentials
    "S107",   # Possible hardcoded password (default) - test fixtures use dummy credentials
    "SIM300", # Yoda condition
    "SLF001", # Private member accessed
    "T201",   # print found
    "T203",   # `pprint` found
]
"matrix_jitsi_bot/cli.py" = [
    "FBT001", # Boolean positional argument in function definition - typer flags need this
    "FBT003", # Boolean positional value in function call - typer flags need this
    "TC003",  # Path must be a real (not TYPE_CHECKING-only) import - typer inspects it at runtime
]
"**/migrations/*.py" = [
    "E501", # line too long - autogenerated by Django
    "Q000", # single quotes - autogenerated by Django
    "RUF012", # mutable class attributes - autogenerated by Django
]
"docs/conf.py" = [
    "INP001", # Add an `__init__.py`
]
"matrix_jitsi_bot/_version.py" = [
    "RUF022", # __all__ is not sorted
    "Q000",   # single quotes
]


[tool.pytest.ini_options]
# see https://docs.pytest.org/en/6.2.x/customize.html
minversion = "6.0"
# see https://docs.pytest.org/en/6.2.x/reference.html?highlight=testpaths#confval-testpaths
testpaths = [
    "matrix_jitsi_bot/tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.uv]
python-preference = "managed"

[tool.uv.workspace]
members = [
    ".",
]
